
services:

  # =====================================
  # Kafka - KRaft single broker
  # =====================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: tradesphere-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - tradesphere-network


  # =====================================
  # Order Service - Spring Boot
  # =====================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile

    image: tradesphere/order-service:local
    container_name: tradesphere-order-service

    ports:
      - "8080:8080"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - tradesphere-network


  # =====================================
  # Kafka UI (Optional)
  # =====================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tradesphere-kafka-ui

    ports:
      - "8089:8080"

    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: tradesphere
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - tradesphere-network


networks:
  tradesphere-network:
    driver: bridge