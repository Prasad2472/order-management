spring.application.name=order-service

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# Enable the H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configure the data source
# Persists data to a file named 'testdb_file' in your user home directory
spring.datasource.url=jdbc:h2:file:~/orderservicedb
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate properties
# Automatically updates the schema based on entities
spring.jpa.hibernate.ddl-auto=update
# Show executed SQL in the console
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
